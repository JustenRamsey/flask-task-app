            <!-- Login form -->
             <!-- Testing new HTML form for web page here  -->
                
<section class="vh-100" style="background-image: url(https://images7.alphacoders.com/585/585602.png);">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100 ">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-2-strong" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">

                        <h3 class="mb-5">Login</h3>

                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="form-floating mb-4">
                                <input type="text" id="floating-input" class="form-control form-control-lg" placeholder="username" name="username" value="{{ request.form.username }}" required/>
                                <label for="floating-input">Username</label>
                            </div>
    
                            <div class="form-floating mb-4">
                                <input type="password" id="floating-input" class="form-control form-control-lg" placeholder="password" name="password" value="{{ request.form.password }}" required/>
                                <label for="floating-input">Password</label>
                            </div>
                            
    
                            <div class="d-grid gap-2 col-6 mx-auto">
                                <button class="btn btn-primary" id="login-button" type="submit" value="login">Login</button>
                            </div>
                            <br>
                            <br>
                            <br>
    
                            <div class="d-grid gap-2 col-12 mx-auto">
                                <h4><small>Don't have an account? <a href="{{ url_for('register')}}">Register here</a></small></h4>
                            </div>
                        </form>

                        {% if error %}
                        <div class="alert alert-danger mt-3">
                            <p class="error"><strong>Error:</strong> {{ error }}
                        </div>
                         {% endif %} 


                    </div>

                </div>

            </div>
        </div>
        
    </div>
</section>
