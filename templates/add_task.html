<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'styles.css' ) }}">
    <script src="https://kit.fontawesome.com/65416ffc0d.js" crossorigin="anonymous"></script>
    <title>Main Page</title>
</head>
<body class="bg-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"><i class="fa-solid fa-hourglass-start fa-beat-fade fa-xl" style="color: #FFD43B;"></i></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">MENU</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
              <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item">
                    <button type="button" class=" btn btn-dark">
                        <a class="nav-link active" aria-current="page" href="{{url_for('login')}}">(Wrong Account? Login here)  <i class="fa-solid fa-house fa-sm" style="color: #FFD43B;"></i></a>
                    </button>
                    <li class="nav-item">
                        <button type="button" class=" btn btn-dark">
                            <a class="nav-link active" aria-current="page" href="{{url_for('logout')}}">Logout  <i class="fa-solid fa-person-through-window" style="color: #FFD43B;"></i></a>
                        </button>
                    </li>
                </li>
                </nav>
        <!-- Navbar -->

        <!-- Task Form -->

                <!-- Testing new UI for add task form ^^ -->

                <section class="vh-100" style="background-image: url(https://images7.alphacoders.com/585/585602.png);">
                    <div class="container py-5 h-100">
                        <div class="row d-flex justify-content-center align-items-center h-100 ">
                            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                                <div class="card shadow-2-strong" style="border-radius: 1rem;">
                                    <div class="card-body p-5 text-center">
                
                                        <h3 class="mb-5">Add Task</h3>
                
                                        <form action="{{ url_for('add_task') }}" method="POST">
                                            <div class="form-floating mb-4">
                                                <input type="text" id="floating-input task" class="form-control form-control-lg" placeholder="Enter your task" name="task" value="{{ request.form.task }}" required />
                                                <label for="floating-input">Enter your task</label>
                                            </div>
                    
                                            <div class="form-floating mb-4">
                                                <input type="password" id="floating-input time_minutes" class="form-control form-control-lg" placeholder="Time in minutes" name="time_minutes" value="{{ request.form.time_minutes }}" required/>
                                                <label for="floating-input">Time in minutes</label>
                                            </div>
                                            
                    
                                            <div class="d-grid gap-2 col-6 mx-auto">
                                                <button type="submit" class="btn btn-light"><i class="fa-solid fa-plus fa-2xl" style="color: black;"></i></button>
                                            </div>
                                        </form>
                                        <br>
                                        <br>

                                        <div class="container mt-5 w-50 mx-auto">
                                            <h2 class="mb-4">Task List</h2>
                                            <table class="table table-dark">
                                                <thead>
                                                    <tr>
                                                        <th>Task</th>
                                                        <th>Time (Minutes)</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {% for task in tasks %}
                                                    <tr>
                                                        <td>{{ task['task'] }}</td>
                                                        <td>{{ task['time_minutes'] }}</td>
                                                        <td>
                                                            <form action="{{ url_for('delete_task', task_id=task['id']) }}" method="POST">
                                                                <button type="submit" class="btn btn-lg btn-danger col-12">DELETE</button>
                                                            </form>
                                                        </td>
                                                    </tr>
                                                    {% endfor %}
                                                    <tr class="bg-success">
                                                        <td class="bg-success"><strong>Total Time</strong></td>
                                                        <td class="bg-success"><strong>{{ time_sum }}</strong></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        
                    
                                    </div>
                
                                </div>
                
                            </div>
                        </div>
                        
                    </div>
                </section>
    
                

                <!-- Testing new UI for add task form ^^ -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
